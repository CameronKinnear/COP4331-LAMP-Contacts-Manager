<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrownBook</title>
    <link rel="stylesheet" href="style/basic_style.css">
    <link rel="stylesheet" href="style/widgets.css">
    <link rel="stylesheet" href="style/contacts.css">
</head>

<body>
    <div id="header-bar">
        <div id="logo">
            <img id="main-logo" src="images/brownbook_logo.png" alt="Logo">
            <h1>BrownBook</h1>
            <h1 id="header-name">Hello, <span id="user-name">Placeholder</span>!</h1>
        </div>
    </div>

    <div id="main-content">
        <!-- 1. LEFT COLUMN -->
        <div id="contacts-column">
            <input type="text" id="contact-search-bar" placeholder="Enter Contact Name">
            <div id="search-bar-divider"></div>

            <!-- Contacts list -->
            <div id="contacts-display">
                <div class="contact-element">
                    <button class="select-this-contact button-nodesign"
                        onclick="DisplaySelectedContact(this.parentElement)">
                        <div class="contact-left">
                            <img src="images/placeholder_user.png" class="contact-icon" alt="Contact Icon">
                        </div>
                        <div class="contact-right">
                            <div class="contact-top">
                                <label class="contact-first-name">Placeholder</label>
                                <label class="contact-last-name">Name</label>
                            </div>
                            <div class="contact-bot">
                                <label class="contact-phone no-display">123-456-7890</label>
                                <label class="contact-email">example@gmail.com</label>
                            </div>
                        </div>
                    </button>
                    <button class="edit-this-contact hidden" value="edit"
                        onclick="EditSelectedContact(this.parentElement)">
                        <img class="contact-change-icon edit-icon" src="images/edit_icon.png" alt="Edit">
                    </button>
                    <button class="delete-this-contact hidden" value="delete"
                        onclick="DeleteSelectedContact(this.parentElement)">
                        <span class="delete-confirm-text no-display">Confirm Deletion</span>
                        <img class="contact-change-icon trash-icon" src="images/trash-icon.png" alt="Delete">
                    </button>
                </div>
            </div><!-- END #contacts-column -->
            <button id="add-new-contact-button" onclick="AddNewContact()">
                <span class="text-medium">Add New Contact</span>
            </button>
        </div>
        <!-- 2. RIGHT COLUMN (Now safely inside #main-content) -->
        <div id="selected-contact-column">
            <div id="selected-contact-header" class="hidden">
                <div id="selected-contact-header-left">
                    <img id="selected-contact-img" src="images/placeholder_user.png" alt="Contact Avatar">
                </div>
                <div id="selected-contact-header-right">
                    <div id="selected-contact-header-top">
                        <div class="name-field-container">
                            <label for="selected-contact-first-name" class="field-caption">First Name</label>
                            <input type="text" id="selected-contact-first-name" class="contact-input-field"
                                placeholder="First Name" autocomplete="off">
                        </div>
                        <div class="name-field-container">
                            <label for="selected-contact-last-name" class="field-caption">Last Name</label>
                            <input type="text" id="selected-contact-last-name" class="contact-input-field"
                                placeholder="Last Name" autocomplete="off">
                        </div>
                        <div class="name-field-container">
                            <label for="selected-contact-phone" class="field-caption">Phone Number</label>
                            <input type="tel" id="selected-contact-phone" class="contact-input-field"
                                placeholder="123-456-7890" autocomplete="off">
                        </div>
                        <div class="name-field-container">
                            <label for="selected-contact-email" class="field-caption">Email Address</label>
                            <input type="email" id="selected-contact-email" class="contact-input-field"
                                placeholder="name@example.com" autocomplete="off">
                        </div>
                    </div>
                    <div id="selected-contact-header-bot"></div>
                </div>
            </div>

            <!-- Widgets container -->
            <div id="selected-contact-widgets" class="no-display"></div>

            <div id="drag-widget-here-to-add" class="hidden">
                <div class="plus-sign"></div>
            </div>
        </div><!-- END #selected-contact-column -->
    </div><!-- END #main-content -->

    <footer id="widgets" class="no-display">
        <div class="widget-box">
            <div id="widget-note" class="draggable-widget" draggable="true"></div>
            <label class="widget-label">Note</label>
        </div>
    </footer>

    <script src="scripts/contacts_handler.js" defer></script>
    <script src="scripts/contacts_basic.js" defer></script>
</body>

</html>
