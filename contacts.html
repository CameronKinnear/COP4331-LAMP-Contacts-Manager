<html>
    <head>
        <link rel="stylesheet" href="style/contacts.css">
        <link rel="stylesheet" href="style/basic_style.css">
        <link rel="stylesheet" href="style/widgets.css">
        
    </head>
    <body>
        <div id="header-bar">
            <div id="logo">
                <img id="main-logo" src="images/brownbook_logo.png">
                <h1>BrownBook</h1>
            </div>
        </div>
        <div id="main-content">
            <div id="contacts-column">
                <input type="text" id="contact-search-bar" placeholder="Enter Contact Name">
                <div id="search-bar-divider"></div>
                <!-- Where the selectable contacts are diplayed for selection -->
                <div id="contacts-display">
                    <button class="contact-element" onclick="DisplaySelectedContact(this)">
                        <div class="contact-left">
                            <img src="images/placeholder_user.png" class="contact-icon">
                        </div>
                        <div class="contact-right">
                            <div class="contact-top">
                                <label class="contact-first-name">Placeholder</label>
                                <label class="contact-last-name">Name</label>
                            </div>
                            <div class="contact-bot">
                                <label class="contact-phone">123-456-7890</label>
                            </div>
                        </div>
                    </button>
                </div>
            </div>
            <!-- The portion of the screen which displays the selected contact -->
            <div id="selected-contact-column">

                <!-- The header of the selected contact (image, name, basic info) -->
                <div id="selected-contact-header">
                    <div id="selected-contact-header-left">
                        <img id="selected-contact-img">
                    </div>
                    <div id="selected-contact-header-right">
                        <div id="selected-contact-header-top">
                            <label id="selected-contact-first-name" class="big-name-text"></label>
                            <label id="selected-contact-last-name" class="big-name-text"></label>
                        </div>
                        <div id="selected-contact-header-bot">
                            
                        </div>
                    </div>
                    

                </div>

                <!-- The widgets attactched to the selected contact (groups, birthday, etc.) -->
                <div id="selected-contact-widgets">

                </div>

                <!-- A box that is pushed to the bottom of the contact which acts as the drop point for new widgets -->
                <div id="drag-widget-here-to-add" class="hidden">
                    <div class="plus-sign"></div>
                </div>
            </div>
        </div>
        <footer id="widgets">
            <div class="widget-box">
                <div id="widget-note" class="draggable-widget" draggable="true">

                </div>
                <label class="widget-label">Note</label>
            </div>
            
            
        </footer>

        <script src="scripts/contacts_handler.js" defer></script>
    </body>
</html>
