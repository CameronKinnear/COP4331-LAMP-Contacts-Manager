<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrownBook</title>
    <link rel="icon" type="image/png" href="images/brownbook_logo.png?v=2">
    <link rel="stylesheet" href="style/basic_style.css">
    <link rel="stylesheet" href="style/index.css">

    <script src="scripts/login.js" defer></script>
</head>
<body>
    <header>
        <div class="header-content">
            <img src="images/brownbook_logo.png?v=2" alt="BrownBook Logo" class="logo">
            <h1>BrownBook</h1>
        </div>
    </header>

    <div id="login-box" class="block-center">

        <!-- Login Form-->
        <form id="login-form" onsubmit="event.preventDefault(); AttemptLogin();">

            <!-- Login Username -->
            <div id="login-username-box" class="login-form-box">
                <label id="username-label" class="text-large">Username</label> <br>
                <input type="text" id="login-username-input" value="" class="login-input" placeholder="Enter Username">
            </div>

            <!-- Login Password-->
            <div id="login-password-box" class="login-form-box">
                <label id="password-label" class="text-large">Password</label> <br>
                <input type="password" id="login-password-input" value="" class="login-input" placeholder="Enter Password">
            </div>

            <!-- Login Button -->
            <button type="submit" id="login-button" class="login-form-box flex-center">
                <span id="button-text" class="text-center">Sign In</span>
            </button>
            <div id="login-result"></div>
            <a href="signup.html" class="flex-center">Register New Account</a>
        </form>

    </div>

</body>
</html>
